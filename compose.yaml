# Local development dependencies. Production uses managed RDS.
services:
  db:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=ON"]
    environment:
      MYSQL_DATABASE: blog_test
      MYSQL_USER: blog
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [mysql_data:/var/lib/mysql]
    ports: ["127.0.0.1:3307:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    command: [migrate]
    environment: &api_environment
      APP_ORIGIN: http://localhost:8080
      DATABASE_HOST: db:3306
      DATABASE_NAME: blog_test
      DATABASE_USER: blog
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      DATABASE_TLS: "false"
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_hash
      LISTEN_ADDR: 0.0.0.0:8081
      EXTERNAL_SYNC_ENABLED: "true"
      MEDIA_DIRECTORY: /data/media
      BACKUP_DIRECTORY: /backup/archives
      BACKUP_ENABLED: "true"
    secrets: [db_password, admin_hash]
    depends_on:
      db: { condition: service_healthy }
  api:
    build: ./backend
    environment: *api_environment
    secrets: [db_password, admin_hash]
    volumes: [media_data:/data, backup_data:/backup]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    build: ./frontend
    environment:
      API_BASE_URL: http://api:8081
    depends_on: [api]
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    environment:
      API_UPSTREAM: api:8081
      WEB_UPSTREAM: web:3000
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [web]
    restart: unless-stopped
secrets:
  db_password: { file: ./config/db-password.txt }
  admin_hash: { file: ./config/admin-hash.txt }
volumes:
  mysql_data:
  media_data:
  backup_data:
