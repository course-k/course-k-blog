name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test scripts/local-config.test.mjs
      - run: python3 scripts/check-repository.py
      - run: python3 -m unittest discover -s scripts/aws -p 'test_*.py' -v
      - run: python3 -m unittest discover -s infra/monitoring -p 'test_*.py' -v
      - name: Validate production CloudFormation without AWS access
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn-lint"
          "$RUNNER_TEMP/cfn-lint/bin/pip" install --disable-pip-version-check cfn-lint==1.57.2
          python3 scripts/aws/production.py > "$RUNNER_TEMP/production.template.json"
          "$RUNNER_TEMP/cfn-lint/bin/cfn-lint" -r us-west-2 -t "$RUNNER_TEMP/production.template.json"
      - run: python3 scripts/aws/validation.py --config infra/aws/validation-environment.example.json plan

  frontend:
    name: Frontend and offline UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          PLAYWRIGHT_CHANNEL: chromium

  backend:
    name: Go and real MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: blog_test
          MYSQL_ROOT_HOST: "%"
          # Disposable CI service; no production credentials or data.
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: go mod download
      - run: go test -race -v ./...
        env:
          TEST_DATABASE_URL: ''
          TEST_TLS_DATABASE_URL: ''
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -count=1 -race -v ./internal/mysql
        env:
          TEST_DATABASE_URL: mysql://root@127.0.0.1:${{ job.services.mysql.ports[3306] }}/blog_test?tls=false
          TEST_TLS_DATABASE_URL: ''
      - run: node ../scripts/test-mysql-tls.mjs

  acceptance:
    name: Browser, SSR, Go and MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/test-local-e2e.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: node scripts/test-local-e2e.mjs --single-task
        env:
          PLAYWRIGHT_CHANNEL: chromium
