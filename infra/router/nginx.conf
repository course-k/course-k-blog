worker_processes 1;
pid /tmp/nginx/nginx.pid;
# Nginx error messages may contain the original URL, including an OIDC code.
# Health checks and the outcome log provide status without logging credentials.
error_log /dev/null;
events { worker_connections 256; }
http {
    server_tokens off;
    client_body_temp_path /tmp/nginx/client-body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    log_format outcome '$request_method $status $request_time $upstream_status';
    access_log /dev/stdout outcome;
    upstream screens { server 127.0.0.1:3000; keepalive 16; }
    upstream api { server 127.0.0.1:8081; keepalive 16; }
    server {
        listen 8080;
        client_max_body_size 7m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Preserve streaming SSR and never retry a write against another upstream.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_redirect off;
        proxy_read_timeout 30s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        location = /gateway-healthz {
            default_type application/json;
            return 200 '{"ok":true}';
        }
        location = /api { proxy_pass http://api; }
        location /api/ { proxy_pass http://api; }
        location / { proxy_pass http://screens; }
    }
}
